<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS 디자인실</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/quiz.css">
<link rel="stylesheet" href="../common/hud.css"> <!-- [통합] 세 방 공용 상단 바 -->
</head>
<body>
<main id="scene">
  <img src="images/classroom.png" alt="숭실대학교 강의실">
  <header class="hud" id="hud"> <!-- [통합] 세 방 공용 상단 바 -->
    <div class="brand"><span class="room-mark css">CSS</span><span class="brand-name">CSS 디자인실</span></div>
    <div class="hud-progress">
      <div class="hud-label"><span>진행률</span><strong id="pct">0%</strong></div>
      <div class="progress-track"><span id="fill"></span></div>
      <small><span id="done2">0</span> / 4 미션 완료</small>
    </div>
    <div class="hud-timer">
      <span>경과 시간</span><strong id="total">00:00</strong>
      <button id="pauseBtn" type="button">Ⅱ 정지</button>
    </div>
    <div class="hud-hint"><span>힌트 사용</span><strong id="hintTotal">0</strong></div>
    <button class="checklist-toggle" id="cl-btn" type="button">체크리스트 (<span id="done">0</span>/4) ⌄</button>
    <div class="menu-wrap">
      <button class="menu-toggle" id="menu-btn" type="button" aria-label="메뉴 열기"><span class="dots"><i></i><i></i><i></i></span></button>
      <div class="menu-dropdown" id="menuDropdown" hidden>
        <button type="button" id="m-retry"><span>↻</span>다시하기</button>
        <button type="button" id="m-main"><span>⌂</span>메인 화면</button>
        <button type="button" id="menuMusic"><span>♪</span>배경음악 설정</button>
      </div>
    </div>
  </header>
  <aside id="checklist" hidden>
    <h2>CSS 미션</h2>
    <ul>
      <li data-q="board">칠판 · 선택자</li>
      <li data-q="monitor">모니터 · 너비</li>
      <li data-q="locker">사물함 · hover</li>
      <li data-q="desk">책상 · checked</li>
    </ul>
  </aside>
  <button class="hot" id="h-board" data-q="board" aria-label="칠판"></button>
  <button class="hot" id="h-monitor" data-q="monitor" aria-label="모니터"></button>
  <button class="hot" id="h-locker" data-q="locker" aria-label="사물함"></button>
  <button class="hot" id="h-desk" data-q="desk" aria-label="책상"></button>
</main>

<div class="pause-notice" id="pauseNotice" role="status" hidden> <!-- [통합] JS 방과 같은 일시정지 안내 -->
  <strong>⏸ 일시정지 중</strong>
  <p>타이머를 재개하면 미션을 풀고 힌트를 볼 수 있어요.</p>
  <button class="primary-button" id="pauseResume" type="button">▶ 재개하기</button>
</div>
  <!-- 배경음악 설정 팝업: 켜기/끄기 + 볼륨만 조절 (음악 파일은 app.js의 BGM_SRC에서 지정) -->
  <div class="modal-backdrop music-backdrop" id="musicModal" hidden>
    <section class="hint-window music-window" role="dialog" aria-modal="true" aria-labelledby="musicTitle">
      <header class="hint-header"><h2 id="musicTitle">배경음악 설정</h2><button class="icon-button" id="closeMusic" type="button" aria-label="닫기">×</button></header>
      <div class="music-row">
        <div class="music-row-text"><strong>배경음악</strong><small id="musicState">켜짐</small></div>
        <button class="switch" id="musicSwitch" type="button" role="switch" aria-checked="true" aria-label="배경음악 켜기/끄기"><span class="switch-knob"></span></button>
      </div>
      <label class="music-volume"><span>볼륨 <b id="musicVolumeText">50%</b></span><input type="range" id="musicVolume" min="0" max="100" value="50"></label>
      <p class="music-note" id="musicNote" hidden></p>
    </section>
  </div>


<dialog id="modal">
  <span class="eyebrow">CSS 미션</span>
  <h2 id="q-title"></h2>
  <p id="q-text"></p>
  <div id="q-body"></div>
  <form id="form">
    <input id="ans" autocomplete="off" placeholder="정답 입력">
    <button type="submit" class="primary-button">제출</button>
    <button type="button" id="hint-btn" class="ghost-button">힌트</button>
    <button type="button" id="close" class="ghost-button">닫기</button>
  </form>
  <p id="hint" hidden></p>
  <p id="msg"></p>
</dialog>

<section id="end" hidden>
  <div class="end-card">
    <span class="end-mark" id="e-mark">✓</span>
    <h1 id="e-title"></h1><p id="e-text"></p>
    <a id="e-go" class="primary-button" href="../js-room/index.html" hidden>JavaScript 동아리방으로 이동 →</a>
    <button id="e-retry" class="primary-button" hidden>다시 시작</button>
  </div>
</section>

<script src="../common/hint.js"></script>
<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script>window.BREAK_BGM_SRC = "";</script> <!-- [통합] 배경음악 파일 경로 -->
<script src="../common/bgm.js"></script>
</body>
</html>
