<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS 방</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/quiz.css">
</head>
<body>
<main id="scene">
  <img src="images/classroom.png" alt="숭실대학교 강의실">
  <header id="hud">
    <span class="logo">CSS</span><span>방</span><i></i>
    <span>진행률: <b id="pct">0%</b></span><span class="bar"><span id="fill"></span></span><i></i>
    <span>타이머 <b id="timer">05:00</b></span><i></i>
    <button id="cl-btn">체크리스트 (<span id="done">0</span>/4) ⌄</button>
  </header>
  <ul id="checklist" hidden>
    <li data-q="board">칠판 · 선택자</li>
    <li data-q="monitor">모니터 · 너비</li>
    <li data-q="locker">사물함 · hover</li>
    <li data-q="desk">책상 · checked</li>
  </ul>
  <button class="hot" id="h-board" data-q="board" aria-label="칠판"></button>
  <button class="hot" id="h-monitor" data-q="monitor" aria-label="모니터"></button>
  <button class="hot" id="h-locker" data-q="locker" aria-label="사물함"></button>
  <button class="hot" id="h-desk" data-q="desk" aria-label="책상"></button>
</main>

<dialog id="modal">
  <h2 id="q-title"></h2>
  <p id="q-text"></p>
  <div id="q-body"></div>
  <form id="form">
    <input id="ans" autocomplete="off" placeholder="정답 입력">
    <button type="submit">제출</button>
    <button type="button" id="hint-btn">힌트</button>
    <button type="button" id="close">닫기</button>
  </form>
  <p id="hint" hidden></p>
  <p id="msg"></p>
</dialog>

<section id="end" hidden>
  <h1 id="e-title"></h1><p id="e-text"></p>
  <a id="e-go" href="js-room.html" hidden>JavaScript방으로 이동</a>
  <button id="e-retry" hidden>다시 시작</button>
</section>

<script src="js/data.js"></script>
<script src="js/game.js"></script>
</body>
</html>
