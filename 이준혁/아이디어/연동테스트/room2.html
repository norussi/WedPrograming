<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS 디자인실 · 연동 테스트</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-stage="css" data-next="" data-prev="room1.html">
<header class="hud"><div class="hud-inner">
  <div class="hud-l">
    <div class="brand"><span class="logo" aria-hidden="true">⌘</span><span class="badge css">CSS</span><span>디자인실</span></div>
    <span class="sep"></span>
    <span class="lbl">진행률</span><b id="pct">0%</b><span class="meter" id="meter" role="progressbar" aria-label="성적 복구 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="barFill"></i></span>
    <span class="sep"></span>
    <span class="lbl">타이머</span><b id="timer">00:00</b>
    <span class="sep"></span>
    <span class="lbl">힌트</span><b><span id="hintN">0</span>회</b>
  </div>
  <div class="hud-r"><span class="lbl" id="nick"></span><button id="pauseBtn">일시정지</button><button id="resetBtn">처음부터</button></div>
</div></header>

<main class="wrap">
  <section class="panel">
    <p class="eyebrow">STAGE 02 · 연동 테스트</p>
    <h1>CSS 디자인실</h1>
    <p class="muted">HTML 실습실에서 넘어온 값이 오른쪽에 보이면 연동 성공입니다. 여기서 힌트를 더 받거나 통과하면 값이 이어서 쌓입니다.</p>
    <div class="actions">
      <button class="btn" id="hintBtn">힌트 받기 (+1)</button>
      <button class="btn primary" id="clearBtn">미션 통과 처리</button>
    </div>
    <ul class="stages" id="stageList"></ul>
    <div class="actions"><button class="btn" id="prevBtn">← HTML 실습실로 돌아가기</button></div>
  </section>

  <aside class="panel">
    <h2>받은 데이터 <span class="src" id="src"></span></h2>
    <table>
      <tr><th>닉네임</th><td id="rNick"></td></tr>
      <tr><th>진행률</th><td id="rPct"></td></tr>
      <tr><th>타이머</th><td id="rTime"></td></tr>
      <tr><th>힌트 사용</th><td id="rHint"></td></tr>
    </table>
    <pre id="raw"></pre>
    <p class="notice">통과하면 진행률이 67%가 됩니다. 새로고침하거나 HTML 실습실로 돌아가도 값이 유지되는지 확인해 보세요.</p>
  </aside>
</main>
<script src="break-state.js"></script>
<script src="room.js"></script>
</body>
</html>
