<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML 실습실 · 연동 테스트</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-stage="html" data-next="room2.html" data-prev="">
<header class="hud"><div class="hud-inner">
  <div class="hud-l">
    <div class="brand"><span class="logo" aria-hidden="true">⌘</span><span class="badge html">HTML</span><span>실습실</span></div>
    <span class="sep"></span>
    <span class="lbl">진행률</span><b id="pct">0%</b><span class="meter" id="meter" role="progressbar" aria-label="성적 복구 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="barFill"></i></span>
    <span class="sep"></span>
    <span class="lbl">타이머</span><b id="timer">00:00</b>
    <span class="sep"></span>
    <span class="lbl">힌트</span><b><span id="hintN">0</span>회</b>
  </div>
  <div class="hud-r"><span class="lbl" id="nick"></span><button id="pauseBtn">일시정지</button><button id="resetBtn">처음부터</button></div>
</div></header>

<main class="wrap">
  <section class="panel">
    <p class="eyebrow">STAGE 01 · 연동 테스트</p>
    <h1>HTML 실습실</h1>
    <p class="muted">힌트를 몇 번 받고 미션을 통과한 뒤 CSS 디자인실로 이동해 보세요. 진행률·타이머·힌트 횟수가 다음 방으로 그대로 넘어가야 합니다.</p>
    <div class="actions">
      <button class="btn" id="hintBtn">힌트 받기 (+1)</button>
      <button class="btn primary" id="clearBtn">미션 통과 처리</button>
    </div>
    <ul class="stages" id="stageList"></ul>
    <div class="actions"><button class="btn primary" id="nextBtn">CSS 디자인실로 이동 →</button></div>
  </section>

  <aside class="panel">
    <h2>받은 데이터 <span class="src" id="src"></span></h2>
    <table>
      <tr><th>닉네임</th><td id="rNick"></td></tr>
      <tr><th>진행률</th><td id="rPct"></td></tr>
      <tr><th>타이머</th><td id="rTime"></td></tr>
      <tr><th>힌트 사용</th><td id="rHint"></td></tr>
    </table>
    <pre id="raw"></pre>
    <p class="notice">이 방을 통과하면 진행률이 33%가 됩니다. 이동 버튼은 sessionStorage에 저장하고, 예비로 URL 쿼리(?n=&t=&r=&h=&c=)에도 값을 실어 보냅니다.</p>
  </aside>
</main>
<script src="break-state.js"></script>
<script src="room.js"></script>
</body>
</html>
